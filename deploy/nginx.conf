server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # This deployment is a review site, separate from the existing live domain.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/enquiries {
        client_max_body_size 12k;
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 20s;
    }

    # These URLs include content hashes; changed bytes produce new filenames.
    location ~ ^/(?:_astro|optimized)/ {
        expires 1y;
        try_files $uri =404;
    }

    # CMS asset paths may be reused. Revalidate after one day rather than
    # making them immutable; ETag/Last-Modified remain available by default.
    location ~ ^/(?:images|fonts)/ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
